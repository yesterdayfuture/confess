[project]
name = "confess-cli"
version = "0.1.0"
description = "Explain AI-assisted code before it ships. A Git pre-push gate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "hook", "ai", "code-review", "mcp", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
confess = "confess.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yourname/confess"
Issues = "https://github.com/yourname/confess/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confess"]

[tool.hatch.build.targets.wheel.force-include]
# Extensionless hook template must ship in the wheel for importlib.resources
"confess/data/pre-push" = "confess/data/pre-push"

[tool.hatch.build.targets.sdist]
include = [
  "/confess",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/pyproject.toml",
]
